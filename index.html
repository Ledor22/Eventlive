      + '&longitude=' + chunk.map(id => TOWNS[id].lng.toFixed(3)).join(',')
      + '&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m&timezone=Europe%2FRome&forecast_days=16';
    fetch(url).then(r => r.json()).then(j => {
      (Array.isArray(j) ? j : [j]).forEach((loc, k) => {
        if (!loc || !loc.hourly) return;
        const H = loc.hourly, m = {};
        H.time.forEach((t, n) => { m[t] = { temp: Math.round(H.temperature_2m[n]), pop: H.precipitation_probability[n] || 0, cond: wmoCond(H.weather_code[n]), wind: Math.round(H.wind_speed_10m[n]), dir: windName(H.wind_direction_10m[n]) }; });
        LIVE[chunk[k]] = m;
      });
      LIVE_SUBS.forEach(f => f());
    }).catch(() => { chunk.forEach(id => LIVE_DONE.delete(id)); });
  }
}
function ensureLive(id) { if (LIVE_DONE.has(id) || !TOWNS[id]) return; LIVE_DONE.add(id); LIVE_PENDING.add(id); if (!LIVE_TIMER) LIVE_TIMER = setTimeout(liveFlush, 150); }
function useLiveWeather(town) {
  const [, setV] = useState(0);
  useEffect(() => { ensureLive(town); const f = () => setV(v => v + 1); LIVE_SUBS.add(f); return () => { LIVE_SUBS.delete(f); }; }, [town]);
  return !!LIVE[town];
}

function dayWeather(town, date) {
  const c = CLIMATE[town]; const r = rng(hashStr(town + date));
  const adj = parseD(date).getMonth() === 11 ? -2 : 0;
  const shift = (r() - 0.5) * 5;
  const rainy = r() < c.rain;
  const cloudy = !rainy && r() < 0.4;
  const partly = r() < 0.5;
  const stormy = rainy && r() < 0.2;
  const rainStart = Math.floor(8 + r() * 10);
  const rainLen = Math.floor(2 + r() * 5);
  const windy = r() < 0.3;
  const dirs = ['Levante', 'Scirocco', 'Ponente', 'Grecale'];
  const dir = windy ? c.dir : dirs[Math.floor(r() * 4)];
  const wind = Math.round(c.wind * (windy ? 1.6 : 0.6 + r() * 0.5));
  return { max: Math.round(c.max + adj + shift), min: Math.round(c.min + adj + shift * 0.6), rainy, cloudy, partly, stormy, rainStart, rainLen, wind, dir };
}

function hourly(town, date, h) {
  const L = LIVE[town] && LIVE[town][`${date}T${pad(h)}:00`];
  return L ? { h, ...L } : hourlySim(town, date, h);
}
function hourlySim(town, date, h) {
  const d = dayWeather(town, date);
  const mean = (d.max + d.min) / 2, amp = (d.max - d.min) / 2;
  const inRain = d.rainy && h >= d.rainStart && h < d.rainStart + d.rainLen;
  let temp = mean + amp * Math.cos(((h - 14) / 24) * 2 * Math.PI) - (inRain ? 1.5 : 0);
  let cond, pop;
  if (inRain) { cond = d.stormy ? 'temporale' : h === d.rainStart ? 'pioggia debole' : 'pioggia'; pop = (d.stormy ? 88 : 72) + ((h * 7) % 9); }
  else if (d.rainy) { cond = 'nuvoloso'; pop = 35 + ((h * 5) % 12); }
  else if (d.cloudy) { cond = h < 11 ? 'poco nuvoloso' : 'nuvoloso'; pop = 10 + ((h * 3) % 8); }
  else { cond = d.partly && h >= 12 && h < 17 ? 'poco nuvoloso' : 'sereno'; pop = 2 + ((h * 3) % 6); }
  const wind = Math.max(3, d.wind + ((h * 13) % 5) - 2 + (inRain ? 4 : 0));
  return { h, temp: Math.round(temp), cond, pop: Math.min(98, pop), wind, dir: d.dir };
}
const wIcon = w => (w.cond === 'sereno' && (w.h >= 19 || w.h < 7) ? 'moon' : COND[w.cond].icon);

function eventWeather(ev, session) {
  const s = toMin(session.start), e = toMin(session.end);
  const startH = Math.floor(s / 60), endH = Math.min(23, Math.ceil(e / 60));
  const step = Math.max(1, Math.ceil((endH - startH) / 6));
  const hours = []; for (let h = startH; h <= endH; h += step) hours.push(h);
  const rows = hours.map(h => hourly(ev.town, session.date, h));
  const temps = rows.map(r => r.temp);
  const maxPop = Math.max(...rows.map(r => r.pop));
  const maxWind = Math.max(...rows.map(r => r.wind));
  const storm = rows.some(r => r.cond === 'temporale');
  const wet = maxPop >= 60, cold = Math.min(...temps) <= 8, windy = maxWind >= 30;
  let level = 'good', label = T('Condizioni ottime');
  if (storm) { level = 'bad'; label = ev.indoor ? T('Temporale (evento al chiuso)') : T("Sconsigliato all'aperto"); }
  else if (wet || windy) { level = 'warn'; label = T('Da valutare'); }
  else if (cold) { level = 'ok'; label = T('Fresco, copriti'); }
  const parts = [];
  if (storm && !ev.indoor) parts.push(T("Temporale previsto: valuta di rimandare o scegli un'altra data."));
  if (wet) parts.push(ev.indoor ? T('Possibile pioggia nel tragitto: porta un ombrello.') : T("Possibile pioggia durante l'evento: porta un k-way."));
  if (cold) parts.push(T('Temperature basse: giacca pesante e sciarpa.'));
  if (windy) parts.push(T('Vento sostenuto ({n} km/h da {d}): copriti bene.', { n: maxWind, d: T(rows[0].dir) }));
  if (!parts.length) parts.push(T("Tempo favorevole: vestiti a strati e goditi l'evento."));
  const ahead = Math.round((parseD(session.date) - parseD(TODAY)) / 86400000);
  const reliability = ahead <= 3 ? T('Affidabilità alta') : ahead <= 7 ? T('Affidabilità media') : T('Tendenza');
  return { rows, start: rows[0], tmin: Math.min(...temps), tmax: Math.max(...temps), maxPop, maxWind, level, label, parts, reliability, dir: rows[0].dir };
}

/* =====================================================================
   SIMULATORE TRASPORTI PUBBLICI
   ===================================================================== */
const TRANSFER = 10; // minuti minimi per il cambio

function findRoute(from, to) {
  let best = null;
  const dfs = (cur, path, visited) => {
    if (cur === to) {
      const cost = path.reduce((s, l) => s + l.link.min, 0) + 15 * (path.length - 1);
      if (!best || cost < best.cost) best = { cost, path: path.slice() };
      return;
    }
    if (path.length >= 3) return;
    for (const lk of LINKS) {
      let next = null, rev = false;
      if (lk.a === cur) next = lk.b; else if (lk.b === cur) { next = lk.a; rev = true; }
      if (!next || visited.has(next)) continue;
      visited.add(next); path.push({ from: cur, to: next, link: lk, rev }); dfs(next, path, visited); path.pop(); visited.delete(next);
    }
  };
  dfs(from, [], new Set([from]));
  return best ? best.path : null;
}

let CUR_DAY = 'wd'; // tipo di giorno del piano in corso: wd feriale, sa sabato, su festivo
function slotsFor(L) {
  const R = L.link.real; // orari ufficiali (da data/orari.json), se disponibili per questo collegamento
  if (R) { const d = R[L.rev ? 'rev' : 'fwd']; return (d && d[CUR_DAY]) || []; }
  const off = L.rev ? Math.round(L.link.freq / 3 / 5) * 5 : 0;
  const out = []; for (let t = L.link.first + off; t <= L.link.last; t += L.link.freq) out.push(t); return out;
}

// Pianifica all'indietro: arrivare entro "deadline"
function planArrive(legs, deadline, count) {
  const back = (i, target) => {
    const s = slotsFor(legs[i]);
    for (let j = s.length - 1; j >= 0; j--) {
      const t = s[j]; if (t + legs[i].link.min > target) continue;
      if (i === 0) return [t];
      const prev = back(i - 1, t - TRANSFER); if (prev) return prev.concat([t]);
    }
    return null;
  };
  const res = []; let dl = deadline;
  for (let k = 0; k < count; k++) {
    const deps = back(legs.length - 1, dl); if (!deps) break;
    res.push(deps); dl = deps[deps.length - 1] + legs[legs.length - 1].link.min - 1;
  }
  return res;
}

// Pianifica in avanti: partire non prima di "startT"
function planDepart(legs, startT, count) {
  const fwd = (i, from) => {
    for (const t of slotsFor(legs[i])) {
      if (t < from) continue;
      if (i === legs.length - 1) return [t];
      const next = fwd(i + 1, t + legs[i].link.min + TRANSFER); if (next) return [t].concat(next);
    }
    return null;
  };
  const res = []; let st = startT;
  for (let k = 0; k < count; k++) { const deps = fwd(0, st); if (!deps) break; res.push(deps); st = deps[0] + 1; }
  return res;
}

function mkItin(legs, deps, stop, dir) {
  const segs = legs.map((L, i) => ({
    L, dep: deps[i], arr: deps[i] + L.link.min,
    from: L.fromStop || stopName(L.from, L.link.mode), to: L.toStop || stopName(L.to, L.link.mode),
  }));
  if (dir === 'out') segs[segs.length - 1].to = stop.name; else segs[0].from = stop.name;
  return {
    segs, dep: segs[0].dep, arr: segs[segs.length - 1].arr,
    total: segs[segs.length - 1].arr - segs[0].dep + stop.walk,
    changes: legs.length - 1, price: legs.reduce((s, l) => s + l.link.price, 0),
  };
}

function buildPlan(ev, session, originId) {
  CUR_DAY = ['su', 'wd', 'wd', 'wd', 'wd', 'wd', 'sa'][parseD(session.date).getDay()];
  let legs;
  if (originId === ev.town) {
    if (!ev.urban) return { here: true };
    const u = ev.urban;
    legs = [{ from: originId, to: ev.town, urban: true, rev: false, fromStop: u.from, toStop: u.to,
      link: { mode: 'bus', line: u.line, min: u.min, freq: u.freq || 15, first: toMin('06:30'), last: toMin(u.last || '23:30'), price: 1.2 } }];
  } else legs = findRoute(originId, ev.town);
  if (!legs) return { none: true };

  const last = legs[legs.length - 1];
  const stop = last.urban ? { name: ev.urban.to, walk: ev.urban.walk } : (ev.stops && ev.stops[last.link.mode]) || { name: stopName(ev.town, last.link.mode), walk: 10 };
  const arriveBy = session.arriveBy ? toMin(session.arriveBy) : toMin(session.start) - 30;
  const leaveAt = session.leaveAfter ? toMin(session.leaveAfter) : toMin(session.end) + 15;
  const rev = legs.slice().reverse().map(L => ({ from: L.to, to: L.from, link: L.link, rev: !L.rev, urban: L.urban, fromStop: L.toStop, toStop: L.fromStop }));

  const out = planArrive(legs, arriveBy - stop.walk, 3).map(d => mkItin(legs, d, stop, 'out'));
  const back = planDepart(rev, leaveAt + stop.walk, 3).map(d => mkItin(rev, d, stop, 'back'));
  let lastPossible = null;
  if (!back.length) {
    const all = planDepart(rev, toMin(session.start), 40);
    if (all.length) lastPossible = mkItin(rev, all[all.length - 1], stop, 'back');
  }
  return { legs, stop, out, back, lastPossible, arriveBy, leaveAt };
}

              <circle cx={x} cy={y} r={(on ? 9 : 7) / k} fill={ZONE[ev.zone].c1} stroke="#fff" strokeWidth={2 / k} />
              <circle cx={x} cy={y} r={2.4 / k} fill="#fff" />
            </g>
          ); })}
        </svg>

        <div className="absolute left-3 top-3 flex flex-col gap-1 rounded-2xl bg-white/85 p-2 text-[11px] font-medium backdrop-blur">
          {ZONES.map(z => <span key={z.id} className="inline-flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-full" style={{ background: z.c1 }} />{z.short}</span>)}
        </div>
        <div className="absolute right-3 top-3 flex flex-col gap-2">
          <button className={btn} aria-label={full ? T('Esci da schermo intero') : T('Schermo intero')} onClick={() => setFull(f => !f)}><Icon name={full ? 'minimize' : 'maximize'} size={18} /></button>
          <button className={btn} aria-label={T('Ingrandisci')} disabled={k >= KMAX} onClick={() => zoomBtn(1.6)}><Icon name="plus" size={18} /></button>
          <button className={btn} aria-label={T('Riduci')} disabled={k <= 1} onClick={() => zoomBtn(1 / 1.6)}><Icon name="minus" size={18} /></button>
          <button className={btn} aria-label={T("Tutta l'isola")} disabled={k <= 1} onClick={() => { setView({ k: 1, cx: VB.x + VB.w / 2, cy: VB.y + VB.h / 2 }); setFocus(null); }}><Icon name="home" size={18} /></button>
        </div>
        {!focus && <span className="absolute bottom-3 left-3 rounded-full bg-white/90 px-3 py-1.5 text-[11px] font-semibold text-stone-700 shadow backdrop-blur">{T('Eventi {n} · Località {m}', { n: items.length, m: new Set(items.map(i => i.ev.town)).size })}</span>}
        {focus && (
          <div className="fade absolute inset-x-3 bottom-3 flex items-center gap-3 rounded-2xl bg-white/95 p-3 shadow-lg backdrop-blur">
            <span className="grid h-9 w-9 shrink-0 place-items-center rounded-full text-white" style={{ background: ZONE[focus.zone].c1 }}><Icon name={focus.peak ? 'landmark' : focus.tier === 1 ? 'building' : 'pin'} size={17} /></span>
            <div className="min-w-0 flex-1">
              <p className="truncate text-sm font-bold">{focus.name}</p>
              <p className="truncate text-xs text-stone-500">{kindTxt(focus)} · {ZONE[focus.zone].name}</p>
            </div>
            {evHere.length > 0 && <button onClick={() => { onSelect(evHere[0].ev.id); setFocus(null); }} className="shrink-0 rounded-full bg-stone-900 px-3.5 py-2 text-xs font-bold text-white">{evHere.length === 1 ? T('Vedi evento') : T('{n} eventi', { n: evHere.length })}</button>}
            <button onClick={() => setFocus(null)} aria-label={T('Chiudi')} className="grid h-8 w-8 shrink-0 place-items-center rounded-full text-stone-400"><Icon name="x" size={16} /></button>
          </div>
        )}
      </div>
      <p className="mt-2 text-center text-[11px] text-stone-400">{T('Pizzica, usa +/− o doppio tocco per zoomare · trascina per spostarti · più zoom, più paesi ({n} località)', { n: PLACES.length })}</p>
      <div className="mt-3">
        {sel ? children : <p className="rounded-2xl bg-white border border-stone-200 p-4 text-center text-sm text-stone-500">{T("Tocca un punto sulla mappa per vedere l'evento, il meteo e l'orario del bus.")}</p>}

    </div>
  );
}

/* ---------- Widget Trasporti ---------- */

      {dir === 'back' && (
        <p className="mb-2 flex items-center gap-2 text-xs text-stone-500"><Icon name="walk" size={14} />{T('{n} min a piedi da {v} fino a «{s}»', { n: stop.walk, v: ev.venue, s: stop.name })}</p>
      )}
      {it.segs.map((s, i) => {
        const train = s.L.link.mode === 'train';
        return (
          <div key={i}>
            {i > 0 && (
              <div className="my-1 ml-4 flex items-center gap-2 border-l-2 border-dashed border-stone-300 py-1.5 pl-5 text-xs font-medium text-amber-700">
                <Icon name="swap" size={13} />{T('Cambio a {town} · attesa {n} min', { town: TOWNS[s.L.from].name, n: s.dep - it.segs[i - 1].arr })}
              </div>
            )}
            <div className="flex gap-3">
              <div className="flex flex-col items-center">
                <div className={`grid h-9 w-9 place-items-center rounded-full text-white ${train ? 'bg-emerald-700' : 'bg-blue-700'}`}><Icon name={train ? 'train' : 'bus'} size={17} /></div>
                <div className="my-1 w-0.5 flex-1 bg-stone-200" />
              </div>
              <div className="flex-1 pb-2 text-sm">
                <p><span className="font-bold tabular-nums">{fmt(s.dep)}</span> <span className="text-stone-800">{s.from}</span></p>
                <p className="my-1 text-xs text-stone-500">{s.L.link.line} · {durTxt(s.L.link.min)} · {eur(s.L.link.price)}</p>
                <p><span className="font-bold tabular-nums">{fmt(s.arr)}</span> <span className="text-stone-800">{s.to}</span></p>
              </div>
            </div>

      })}

          <span><b>{T('Fermata più vicina:')}</b> {T('{s} · {n} min a piedi fino a {v}.', { s: stop.name, n: stop.walk, v: ev.venue })}{stop.note ? ' ' + T(stop.note) + '.' : ''}</span>
        </div>
      )}

}

  const [tab, setTab] = useState('out');

  useEffect(() => { setOpen(0); }, [tab, origin, session.date]);

  return (
    <section className="rounded-3xl border border-stone-200 bg-white p-4 shadow-sm">

      <p className="text-xs text-stone-500">{T(!plan.legs || !plan.legs.some(l => l.link.real) ? 'Autobus ARST e treni Trenitalia · orari simulati' : plan.legs.every(l => l.link.real) ? 'Autobus ARST e treni Trenitalia · orari ufficiali (open data)' : 'Autobus ARST e treni Trenitalia · orari in parte ufficiali, in parte stimati')}</p>

      {plan.none && <p className="mt-4 rounded-2xl bg-amber-50 p-4 text-sm text-amber-800">{T('Nessun collegamento pubblico trovato da {town}.', { town: TOWNS[origin].name })}</p>}

      {plan.legs && (
        <>
          <div className="mt-4 grid grid-cols-2 rounded-2xl bg-stone-100 p-1 text-sm font-semibold">
            {[['out', T('Andata')], ['back', T('Ritorno')]].map(([k, l]) => (
              <button key={k} onClick={() => setTab(k)} className={`rounded-xl py-2 transition ${tab === k ? 'bg-white shadow text-stone-900' : 'text-stone-500'}`}>{l}</button>
            ))}
          </div>
          <p className="mt-3 text-xs text-stone-500">
            {tab === 'out' ? T('Per arrivare entro le {t} · {d}', { t: fmt(plan.arriveBy), d: fmtDay(session.date) }) : T('Per ripartire dopo le {t} · {d}', { t: fmt(plan.leaveAt), d: fmtDay(session.date) })}

              <p className="flex items-center gap-2 font-semibold"><Icon name="alert" size={16} />{tab === 'out' ? T('Nessun collegamento pubblico utile per arrivare in tempo') : T("Nessun collegamento pubblico utile dopo l'evento")}</p>
              {tab === 'back' && plan.lastPossible && <p className="mt-1">{T('Ultimo ritorno possibile in giornata: parte alle')} <b>{fmt(plan.lastPossible.dep)}</b>{T(", prima della fine dell'evento. Valuta car pooling, taxi o pernottamento.")}</p>}
              {tab === 'out' && <p className="mt-1">{T("Prova un'altra data o un'altra città di partenza.")}</p>}
            </div>
          )}

          <div className="mt-3 space-y-2">
            {list.map((it, i) => (
              <div key={i} className={`rounded-2xl border p-3.5 ${i === 0 ? 'border-teal-600 bg-teal-50/40' : 'border-stone-200'}`}>
                <button onClick={() => setOpen(open === i ? -1 : i)} className="flex w-full items-center justify-between text-left">
                  <div>
                    <div className="flex items-center gap-2 text-xl font-extrabold tabular-nums">{fmt(it.dep)}<Icon name="arrowRight" size={16} className="text-stone-400" />{fmt(it.arr)}
                      {i === 0 && <span className="ml-1 rounded-full bg-teal-700 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-white">{T('Consigliato')}</span>}</div>
                    <div className="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-stone-600">
                      <span className="inline-flex items-center gap-1"><Icon name="clock" size={13} />{durTxt(it.total)}</span>
                      <span className="inline-flex items-center gap-1"><Icon name="swap" size={13} />{it.changes ? `${it.changes} ${it.changes > 1 ? T('cambi') : T('cambio')}` : T('Diretto')}</span>
                      <span className="inline-flex items-center gap-1"><Icon name="ticket" size={13} />{eur(Math.round(it.price * 100) / 100)}</span>
                    </div>
                  </div>
                  <Icon name="chevron" size={18} className={`text-stone-400 transition ${open === i ? 'rotate-90' : ''}`} />
                </button>
                {open === i && <Segments it={it} stop={plan.stop} dir={tab} ev={ev} />}
              </div>
            ))}
          </div>
        </>
      )}
    </section>

}

/* ---------- Media viewer ---------- */
function MediaViewer({ ev, index, onClose }) {
  const [i, setI] = useState(index);
  const [playing, setPlaying] = useState(false);
  const [prog, setProg] = useState(0);
  const m = ev.media[i];
  useEffect(() => { setPlaying(false); setProg(0); }, [i]);
  useEffect(() => {
    if (!playing) return;
    const t = setInterval(() => setProg(p => { if (p >= 100) { setPlaying(false); return 0; } return p + 2; }), 200);
    return () => clearInterval(t);
  }, [playing]);
  const z = ZONE[ev.zone];
  return (
    <div className="fade fixed inset-0 z-50 flex flex-col bg-black/90 p-4" onClick={onClose}>
      <div className="flex justify-between text-white"><span className="text-sm opacity-80">{i + 1} / {ev.media.length} · {m.type === 'video' ? T('Video') : T('Foto')}</span>
        <button onClick={onClose} aria-label={T('Chiudi')} className="grid h-9 w-9 place-items-center rounded-full bg-white/15"><Icon name="x" size={18} /></button></div>
      <div className="flex flex-1 items-center justify-center" onClick={e => e.stopPropagation()}>
        <div className="relative aspect-[4/3] w-full max-w-xl overflow-hidden rounded-3xl text-white"
          style={{ background: `linear-gradient(${135 + i * 50}deg, ${z.c1}, ${z.c2})` }}>
          <Icon name={m.type === 'video' ? 'play' : CAT[ev.category].icon} size={160} stroke={1} className="absolute -right-8 -bottom-10 opacity-15" />
          {m.type === 'video' && (
            <>
              <button onClick={() => setPlaying(p => !p)} aria-label={playing ? T('Pausa') : T('Riproduci')} className="absolute inset-0 grid place-items-center">
                <span className="grid h-16 w-16 place-items-center rounded-full bg-white/25 backdrop-blur"><Icon name={playing ? 'pause' : 'play'} size={28} fill="currentColor" /></span>
              </button>
              <div className="absolute inset-x-4 bottom-4 h-1.5 overflow-hidden rounded-full bg-white/25"><div className="h-full bg-white transition-all" style={{ width: prog + '%' }} /></div>
            </>
          )}
          <p className="absolute left-4 top-4 rounded-full bg-black/30 px-3 py-1 text-xs backdrop-blur">{T('Contenuto simulato')}</p>
        </div>
      </div>
      <p className="mb-3 text-center text-sm text-white">{T(m.caption)}</p>
      <div className="flex justify-center gap-2" onClick={e => e.stopPropagation()}>
        {ev.media.map((_, k) => <button key={k} onClick={() => setI(k)} aria-label={T('Media {n}', { n: k + 1 })} className={`h-2 rounded-full transition-all ${k === i ? 'w-6 bg-white' : 'w-2 bg-white/40'}`} />)}
      </div>
    </div>
  );
}

/* ---------- Modal prenotazione (simulata) ---------- */
function BookingModal({ ev, session, onClose }) {
  const [qty, setQty] = useState(() => Object.fromEntries(ev.tiers.map((t, i) => [t.id, i === 0 ? 1 : 0])));
  const [done, setDone] = useState(null);
  const total = ev.tiers.reduce((s, t) => s + t.price * qty[t.id], 0);
  const count = ev.tiers.reduce((s, t) => s + qty[t.id], 0);
  const confirm = () => setDone('SF-' + (hashStr(ev.id + session.date + total + count) % 90000 + 10000));
  return (
    <div className="fade fixed inset-0 z-50 flex items-end justify-center bg-black/50 sm:items-center" onClick={onClose}>
      <div className="sheet max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-t-3xl bg-white p-5 sm:rounded-3xl" onClick={e => e.stopPropagation()}>
        {!done ? (
          <>
            <div className="flex items-start justify-between gap-3">
              <div><h3 className="text-lg font-bold">{ev.free ? T('Prenota il tuo posto') : T('Acquista i biglietti')}</h3>
                <p className="text-sm text-stone-500">{ev.title} · {fmtDay(session.date)} · {session.start}</p></div>
              <button onClick={onClose} aria-label={T('Chiudi')} className="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-stone-100"><Icon name="x" size={18} /></button>
            </div>
            <div className="mt-4 space-y-2">
              {ev.tiers.map(t => (
                <div key={t.id} className="flex items-center justify-between rounded-2xl border border-stone-200 p-3">
                  <div><p className="font-semibold">{T(t.name)}</p><p className="text-xs text-stone-500">{T(t.note)}</p><p className="mt-0.5 text-sm font-bold text-teal-800">{eur(t.price)}</p></div>
                  <div className="flex items-center gap-2">
                    <button aria-label={T('Meno')} onClick={() => setQty({ ...qty, [t.id]: Math.max(0, qty[t.id] - 1) })} className="grid h-9 w-9 place-items-center rounded-full bg-stone-100 active:scale-95"><Icon name="minus" size={16} /></button>
                    <span className="w-5 text-center font-bold tabular-nums">{qty[t.id]}</span>
                    <button aria-label={T('Più')} onClick={() => setQty({ ...qty, [t.id]: Math.min(8, qty[t.id] + 1) })} className="grid h-9 w-9 place-items-center rounded-full bg-stone-900 text-white active:scale-95"><Icon name="plus" size={16} /></button>
                  </div>
                </div>
              ))}
            </div>
            <button disabled={!count} onClick={confirm}
              className="mt-5 flex w-full items-center justify-between rounded-2xl bg-teal-700 px-5 py-4 font-bold text-white transition disabled:bg-stone-300 active:scale-[.99]">
              <span>{total === 0 ? T('Conferma prenotazione') : T('Paga e conferma')}</span><span>{eur(Math.round(total * 100) / 100)}</span>
            </button>
            <p className="mt-2 text-center text-[11px] text-stone-400">{T('Flusso simulato: nessun pagamento reale.')}</p>
          </>
        ) : (
          <div className="py-4 text-center">
            <div className="mx-auto grid h-16 w-16 place-items-center rounded-full bg-emerald-100 text-emerald-700"><Icon name="check" size={32} stroke={3} /></div>
            <h3 className="mt-4 text-xl font-bold">{ev.free ? T('Posto prenotato!') : T('Biglietti confermati!')}</h3>
            <p className="mt-1 text-sm text-stone-600">{count} {count === 1 ? T('persona') : T('persone')} · {ev.title}<br />{fmtDay(session.date, { weekday: 'long', day: 'numeric', month: 'long' })}{T(', ore {t}', { t: session.start })}</p>
            <div className="mx-auto mt-4 inline-block rounded-2xl border-2 border-dashed border-stone-300 px-6 py-3"><p className="text-[11px] uppercase tracking-wider text-stone-500">{T('Codice')}</p><p className="text-2xl font-extrabold tracking-widest">{done}</p></div>
            <button onClick={onClose} className="mt-5 w-full rounded-2xl bg-stone-900 py-3.5 font-bold text-white">{T('Fatto')}</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- Pagina dettaglio ---------- */

  const z = ZONE[ev.zone];
  const upcoming = ev.sessions.filter(s => s.date >= TODAY);
  const sessions = upcoming.length ? upcoming : ev.sessions;
  const [idx, setIdx] = useState(() => Math.max(0, sessions.findIndex(s => s.date === initialDate)));
  const [booking, setBooking] = useState(false);
  const [media, setMedia] = useState(null);
  const session = sessions[idx];

  return (
    <div className="fade mx-auto max-w-2xl pb-32">
      <Hero ev={ev} className="h-52 px-4 pt-4 sm:rounded-b-[2rem]">
        <div className="relative flex items-start justify-between">
          <button onClick={onBack} aria-label={T('Indietro')} className="grid h-10 w-10 place-items-center rounded-full bg-white/20 backdrop-blur"><Icon name="back" size={20} /></button>
          <div className="flex items-center gap-2"><MenuButton dark /><button onClick={() => onFav(ev.id)} aria-label={T('Preferiti')} className="grid h-10 w-10 place-items-center rounded-full bg-white/20 backdrop-blur"><Icon name="heart" size={20} fill={fav ? 'currentColor' : 'none'} /></button></div>
        </div>
        <div className="absolute inset-x-4 bottom-8">
          <span className="inline-flex items-center gap-1.5 rounded-full bg-white/20 px-2.5 py-1 text-xs font-semibold backdrop-blur"><Icon name={CAT[ev.category].icon} size={14} />{T(ev.category)}</span>
          <h1 className="mt-2 text-2xl font-extrabold leading-tight drop-shadow-sm sm:text-3xl">{ev.title}</h1>
        </div>
      </Hero>

      <div className="-mt-4 space-y-4 px-4">
        <section className="rounded-3xl border border-stone-200 bg-white p-4 shadow-sm">
          {sessions.length > 1 && (
            <div className="no-scrollbar -mx-1 mb-4 flex gap-2 overflow-x-auto px-1">
              {sessions.map((s, i) => (
                <button key={s.date} onClick={() => setIdx(i)}
                  className={`shrink-0 rounded-2xl border px-3 py-2 text-left text-sm transition ${i === idx ? 'border-stone-900 bg-stone-900 text-white' : 'border-stone-200 bg-white text-stone-700'}`}>
                  <span className="block text-[11px] uppercase tracking-wide opacity-70">{fmtDay(s.date, { weekday: 'short' })}</span>

              <button key={i} onClick={() => setMedia(i)} aria-label={T(m.caption)}

                style={{ background: `linear-gradient(${135 + i * 50}deg, ${z.c1}, ${z.c2})` }}>

          <h2 className="flex items-center gap-2 text-base font-bold"><Icon name="building" size={19} className="text-teal-700" />{T('Organizzatore')}</h2>

        <p className="px-2 text-center text-[11px] text-stone-400">{T('Prototipo dimostrativo · eventi, prezzi e orari dei mezzi sono dati simulati; il meteo è reale (Open-Meteo) quando disponibile.')}</p>
      </div>

      <div className="fixed inset-x-0 bottom-0 z-40 border-t border-stone-200 bg-white/95 backdrop-blur" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
        <div className="mx-auto flex max-w-2xl items-center justify-between gap-4 px-4 py-3">
          <div><p className="text-[11px] uppercase tracking-wide text-stone-500">{ev.free ? T('Ingresso') : T('Biglietti')}</p><p className="text-lg font-extrabold">{ev.free ? T('Gratuito') : T('da {p}', { p: eur(ev.priceFrom) })}</p></div>

            <Icon name="ticket" size={18} />{ev.free ? T('Prenota gratis') : T('Acquista biglietti')}

      </div>
      {booking && <BookingModal ev={ev} session={session} onClose={() => setBooking(false)} />}
      {media !== null && <MediaViewer ev={ev} index={media} onClose={() => setMedia(null)} />}
    </div>
  );
}

    <div className="fade fixed inset-0 z-50 flex items-end justify-center bg-black/50 sm:items-center" onClick={onClose}>

        <Row title={T('Tipologia')}>

        </Row>
        <Row title={T('Preferenze')}>
          <Chip icon="heart" active={filters.favOnly} onClick={() => set('favOnly', !filters.favOnly)}>{T('Solo i miei preferiti')}</Chip>

          <button onClick={onClose} className="flex-1 rounded-2xl bg-stone-900 py-3.5 font-bold text-white">{T('Mostra {n} {w}', { n: count, w: count === 1 ? T('evento') : T('eventi') })}</button>

      </div>
    </div>
  );
}

/* ---------- Routing via hash: #/evento/<id>?d=YYYY-MM-DD ---------- */
function parseHash() {
  const m = window.location.hash.match(/^#\/evento\/([^?]+)(?:\?d=(.+))?$/);
  return m ? { id: decodeURIComponent(m[1]), date: m[2] || null } : null;
}
function useRoute() {
  const [r, setR] = useState(parseHash);
  useEffect(() => { const f = () => setR(parseHash()); window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
  return r;
}

const dateOk = (d, f) => {
  if (d < TODAY) return false;
  switch (f.when) {
    case 'today': return d === TODAY;
    case 'weekend': return d === SAT || d === SUN;
    case 'week': return d <= addDays(TODAY, 6);
    case 'custom': return !f.date || d === f.date;
    default: return true;
  }
};
const priceOk = (ev, p) => p === 'all' || (p === 'free' && ev.free) || (p === 'upto15' && ev.priceFrom <= 15) || (p === 'over15' && ev.priceTo > 15);

  useEffect(() => { if (route) window.scrollTo(0, 0); else setTimeout(() => window.scrollTo(0, scrollY.current), 0); }, [route && route.id]);

  if (route) {
    const ev = EVENTS.find(e => e.id === route.id);
    if (ev) return <EventDetail key={ev.id} ev={ev} initialDate={route.date} origin={origin} setOrigin={setOrigin} fav={favs.includes(ev.id)} onFav={toggleFav} onBack={back} />;
  }

            <p className="mt-0.5 text-xs text-stone-500">{T('Eventi, meteo e bus della Sardegna in un unico posto')}</p>
          </div>
          <div className="flex items-center gap-2"><MenuButton /><button onClick={() => setFilters({ ...filters, favOnly: !filters.favOnly })} aria-label={T('Preferiti')}
            className={`relative grid h-11 w-11 place-items-center rounded-full border transition ${filters.favOnly ? 'border-rose-500 bg-rose-500 text-white' : 'border-stone-200 bg-white text-stone-700'}`}>
            <Icon name="heart" size={20} fill={filters.favOnly ? 'currentColor' : 'none'} />
            {favs.length > 0 && <span className="absolute -right-1 -top-1 grid h-5 min-w-[20px] place-items-center rounded-full bg-stone-900 px-1 text-[11px] font-bold text-white">{favs.length}</span>}

        <div className="mt-3"><OriginSelect origin={origin} setOrigin={setOrigin} /></div>
      </header>

        <div className="no-scrollbar -mx-4 flex gap-2 overflow-x-auto px-4">
          <Chip active={filters.zone === 'all'} onClick={() => setFilters({ ...filters, zone: 'all' })} icon="map">{T("Tutta l'isola")}</Chip>
          {ZONES.map(z => <Chip key={z.id} dot={z.c1} active={filters.zone === z.id} onClick={() => setFilters({ ...filters, zone: z.id })}>{z.short}</Chip>)}
        </div>
        <div className="no-scrollbar -mx-4 mt-2 flex gap-2 overflow-x-auto px-4">
          <Chip icon="ticket" active={filters.price === 'free'} onClick={() => setFilters({ ...filters, price: filters.price === 'free' ? 'all' : 'free' })}>{T('Solo gratuiti')}</Chip>
          <Chip active={filters.when === 'today'} onClick={() => setFilters({ ...filters, when: filters.when === 'today' ? 'all' : 'today', date: '' })}>{T('Oggi')}</Chip>
          <Chip active={filters.when === 'weekend'} onClick={() => setFilters({ ...filters, when: filters.when === 'weekend' ? 'all' : 'weekend', date: '' })}>{T('Weekend')}</Chip>
          <Chip active={filters.when === 'week'} onClick={() => setFilters({ ...filters, when: filters.when === 'week' ? 'all' : 'week', date: '' })}>{T('7 giorni')}</Chip>
          <Chip icon="sliders" active={activeCount > 0 && filters.price !== 'free' && filters.when !== 'today' && filters.when !== 'weekend' && filters.when !== 'week' || !!filters.date} onClick={() => setSheet(true)}>{T('Filtri')}{activeCount ? ` (${activeCount})` : ''}</Chip>

          </div>

            ))}
          </div>
        </div>

        <div className="mt-4">
          {items.length === 0 ? (
            <div className="rounded-3xl border border-dashed border-stone-300 bg-white p-8 text-center">
              <Icon name="search" size={32} className="mx-auto text-stone-300" />
              <p className="mt-3 font-semibold">{T('Nessun evento con questi filtri')}</p>
              <p className="text-sm text-stone-500">{T("Prova un'altra parola, oppure scegli una località dai suggerimenti per vedere gli eventi vicini.")}</p>
              <button onClick={() => { setFilters({ zone: 'all', when: 'all', date: '', cat: 'all', price: 'all', favOnly: false }); setQ(''); setPlace(null); }} className="mt-4 rounded-full bg-stone-900 px-5 py-2.5 text-sm font-bold text-white">{T('Azzera filtri')}</button>
            </div>
          ) : view === 'list' ? (
            <div className="grid gap-4 md:grid-cols-2">

            </div>

            <MapView items={mapItems} selectedId={pin} onSelect={setPin} origin={origin}>
              {sel && <EventCard ev={sel.ev} session={sel.session} more={sel.more} origin={origin} fav={favs.includes(sel.ev.id)} onFav={toggleFav} onOpen={open} />}
            </MapView>
          )}
        </div>
        <p className="mt-8 text-center text-[11px] text-stone-400">{T('Prototipo hackathon · eventi, prezzi e orari simulati · meteo reale (Open-Meteo)')}</p>
      </main>

      {sheet && <FiltersSheet filters={filters} setFilters={setFilters} count={items.length} onClose={() => setSheet(false)} />}
    </div>
  );
}

function App() {
  const [lang, setLang] = useState(initLang);
  const [settings, setSettings] = useState(initSettings);
  UNIT = settings.unit;
  LANG = lang; // la lingua corrente è letta da T() durante il render
  useEffect(() => {
    try { localStorage.setItem('safesta.lang', lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.title = T('Event live · Eventi Sardegna');
  }, [lang]);
  useEffect(() => {
    try { localStorage.setItem('safesta.settings', JSON.stringify(settings)); } catch (e) {}
    document.documentElement.style.fontSize = settings.text === 'large' ? '112.5%' : '';
  }, [settings]);
  useEffect(() => {
    const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    const apply = () => {
      const dark = settings.theme === 'dark' || (settings.theme === 'auto' && mq && mq.matches);
      document.documentElement.classList.toggle('dark', !!dark);
      const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#151311' : '#0f766e');
    };
    apply();
    if (settings.theme === 'auto' && mq) { mq.addEventListener('change', apply); return () => mq.removeEventListener('change', apply); }
  }, [settings.theme]);
  return <LangCtx.Provider value={{ lang, setLang }}><SettingsCtx.Provider value={{ settings, setSettings }}><AppInner /></SettingsCtx.Provider></LangCtx.Provider>;
}

/* Orari ufficiali: data/orari.json (generato ogni notte dallo script GitHub). Se manca, restano gli orari simulati. */
const applyOrari = j => {
  if (!j || !j.links) return;
  LINKS.forEach(lk => { const r = j.links[`${lk.a}|${lk.b}|${lk.mode}`]; if (r) { lk.real = r; if (r.min) lk.min = r.min; } });
};
const _root = ReactDOM.createRoot(document.getElementById('root'));
Promise.race([
  fetch('data/orari.json', { cache: 'no-cache' }).then(r => (r.ok ? r.json() : null)),
  new Promise(res => setTimeout(() => res(null), 3000)),
]).then(applyOrari).catch(() => {}).then(() => _root.render(<App />));
</script>
</body>
