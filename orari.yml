name: Aggiorna orari

on:
  schedule:
    - cron: "30 2 * * *"   # ogni notte alle 02:30 UTC
  workflow_dispatch:        # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write

jobs:
  orari:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica gli orari ufficiali e genera data/orari.json
        run: python3 scripts/build_orari.py
      - name: Salva se è cambiato qualcosa
        run: |
          git config user.name "orari-bot"
          git config user.email "orari-bot@users.noreply.github.com"
          git add data/orari.json
          git diff --cached --quiet || git commit -m "Aggiorna orari $(date -u +%F)"
          git push
